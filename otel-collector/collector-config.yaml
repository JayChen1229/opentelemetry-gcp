# ============================================================
# OpenTelemetry Collector Configuration
# ============================================================
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 65
    spike_limit_percentage: 20

  resourcedetection:
    detectors: [env, gcp]
    timeout: 2s
    override: false

  # ✅ 動態修正 cloud.resource_id 指向 Service（而非 Revision）
  # 從 App 自帶的 cloud.account.id / cloud.region 取值，支援多專案架構
  transform:
    error_mode: ignore
    trace_statements:
      - context: resource
        statements:
          - set(attributes["gcp.project_id"], attributes["cloud.account.id"]) where attributes["cloud.account.id"] != nil
          - set(attributes["cloud.resource_id"], Concat(["//run.googleapis.com/projects/", attributes["cloud.account.id"], "/locations/", attributes["cloud.region"], "/services/", attributes["service.name"]], "")) where attributes["service.name"] != nil and attributes["cloud.account.id"] != nil and attributes["cloud.region"] != nil
    metric_statements:
      - context: resource
        statements:
          - set(attributes["gcp.project_id"], attributes["cloud.account.id"]) where attributes["cloud.account.id"] != nil
          - set(attributes["cloud.resource_id"], Concat(["//run.googleapis.com/projects/", attributes["cloud.account.id"], "/locations/", attributes["cloud.region"], "/services/", attributes["service.name"]], "")) where attributes["service.name"] != nil and attributes["cloud.account.id"] != nil and attributes["cloud.region"] != nil
    log_statements:
      - context: resource
        statements:
          - set(attributes["gcp.project_id"], attributes["cloud.account.id"]) where attributes["cloud.account.id"] != nil
          - set(attributes["cloud.resource_id"], Concat(["//run.googleapis.com/projects/", attributes["cloud.account.id"], "/locations/", attributes["cloud.region"], "/services/", attributes["service.name"]], "")) where attributes["service.name"] != nil and attributes["cloud.account.id"] != nil and attributes["cloud.region"] != nil

  batch:
    send_batch_size: 256
    timeout: 10s

exporters:
  otlphttp:
    endpoint: https://telemetry.googleapis.com
    auth:
      authenticator: googleclientauth
  debug:
    verbosity: detailed

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  googleclientauth: {}

service:
  telemetry:
    resource:
      gcp.project_id: ${env:GOOGLE_CLOUD_PROJECT}
      cloud.account.id: ${env:GOOGLE_CLOUD_PROJECT}
  extensions: [health_check, googleclientauth]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, transform, batch]
      exporters: [otlphttp, debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, transform, batch]
      exporters: [otlphttp, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, transform, batch]
      exporters: [otlphttp, debug]