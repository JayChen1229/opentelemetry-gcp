# ============================================================
# OpenTelemetry Collector Configuration
# ============================================================
# 部署在 Cloud Run，接收跨專案的 OTLP 遙測資料
# 匯出到 GCP Cloud Trace / Monitoring / Logging
# ============================================================

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    send_batch_size: 256
    timeout: 10s

  resourcedetection:
    detectors: [env]
    timeout: 2s
    override: false

  memory_limiter:
    check_interval: 1s
    limit_percentage: 65
    spike_limit_percentage: 20

exporters:
  otlphttp:
    endpoint: https://telemetry.googleapis.com
    auth:
      authenticator: googleclientauth

  # debug exporter (v0.86+ 已棄用 logging exporter)
  debug:
    verbosity: detailed

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  googleclientauth: {}

service:
  extensions: [health_check, googleclientauth]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [otlphttp, debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [otlphttp, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [otlphttp, debug]
