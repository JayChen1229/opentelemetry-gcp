# ============================================================
# OpenTelemetry Collector Configuration
# ============================================================
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 65
    spike_limit_percentage: 20

  resourcedetection:
    detectors: [env, gcp]
    timeout: 2s
    override: false

  # ✅ 動態修正 cloud.resource_id 指向 Service（而非 Revision）
  transform:
    error_mode: ignore
    trace_statements:
      - context: resource
        statements:
          - replace_pattern(attributes["cloud.resource_id"], "^(//run.googleapis.com/projects/[^/]+/locations/[^/]+)/revisions/.*", Concat(["$$1/services/", attributes["service.name"]], "")) where attributes["cloud.resource_id"] != nil and attributes["service.name"] != nil
    metric_statements:
      - context: resource
        statements:
          - replace_pattern(attributes["cloud.resource_id"], "^(//run.googleapis.com/projects/[^/]+/locations/[^/]+)/revisions/.*", Concat(["$$1/services/", attributes["service.name"]], "")) where attributes["cloud.resource_id"] != nil and attributes["service.name"] != nil
    log_statements:
      - context: resource
        statements:
          - replace_pattern(attributes["cloud.resource_id"], "^(//run.googleapis.com/projects/[^/]+/locations/[^/]+)/revisions/.*", Concat(["$$1/services/", attributes["service.name"]], "")) where attributes["cloud.resource_id"] != nil and attributes["service.name"] != nil

  batch:
    send_batch_size: 256
    timeout: 10s

exporters:
  otlphttp:
    endpoint: https://telemetry.googleapis.com
    auth:
      authenticator: googleclientauth
  debug:
    verbosity: detailed

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  googleclientauth: {}

service:
  extensions: [health_check, googleclientauth]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, transform, batch]
      exporters: [otlphttp, debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, transform, batch]
      exporters: [otlphttp, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, transform, batch]
      exporters: [otlphttp, debug]